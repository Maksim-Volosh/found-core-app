services:
  found_core_mini_app:
    container_name: found_core_mini_app
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  embedding_worker:
    container_name: found_core_embedding_worker
    build: .
    command: celery -A app.worker.celery_app worker -Q embeddings -c 2 -l info
    restart: unless-stopped
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  # Exactly one instance: a second beat would schedule every sweep twice.
  embedding_beat:
    container_name: found_core_embedding_beat
    build: .
    command: celery -A app.worker.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    volumes:
      - .:/code
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  db:
    image: pgvector/pgvector:pg16
    container_name: found_core_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:7-alpine
    container_name: found_core_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: